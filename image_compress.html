
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Compress Image</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
.box{max-width:700px;margin:50px auto;background:white;padding:30px;border-radius:12px}
input,select{width:100%;padding:12px;margin:10px 0}
button{background:#e53935;color:white;border:none;padding:14px 25px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>

<div class="box">

<h1>Compress Image</h1>

<form action="/compress-image" method="POST" enctype="multipart/form-data">

<input type="file" name="image" accept=".jpg,.jpeg,.png,.webp" required>

<label>Target Size</label>

<select name="target">
<option value="20">20 KB (Exam)</option>
<option value="50">50 KB</option>
<option value="100">100 KB</option>
<option value="200">200 KB</option>
<option value="500">500 KB</option>
<option value="custom">Custom</option>
</select>

<input type="number" name="custom_kb" placeholder="Custom KB">

<button type="submit">Compress Image</button>

</form>

</div>

<footer style="margin-top: 50px; padding: 20px; text-align: center; font-size: 12px; color: #7f8c8d; border-top: 1px solid #ecf0f1;">

</footer>

</body>
</html>
