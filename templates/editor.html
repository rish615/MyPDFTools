<!-- Tesseract.js CDN for Client-Side OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title if title else 'PDFJantaParty' }}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">

  <link rel="shortcut icon" href="#">
  <link rel="stylesheet" href="static/css/editor.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

  <style>
    /* =============================================================
    PDF OVERLAY & OCR INTERACTION FIXES
    ============================================================= */

    /* Page container wrapper */
    .page-wrap {
      position: relative !important;
      display: inline-block !important;
      line-height: 0 !important;
    }

/* Hide native text layer from pdf.js that intercepts double-clicks */
    .textLayer {
      display: none !important;
      pointer-events: none !important;
    }

    .pdf-overlay {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      pointer-events: none !important;
      z-index: 50 !important;
    }

    .pdf-overlay .editable-pdf-span,
    .pdf-overlay .ocr-text {
      pointer-events: auto !important;
      z-index: 100 !important;
     cursor: text !important;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <span>PDF Workspace</span>
  </header>

  <div class="toolbar">
    <button id="ocrToolBtn" class="tool-btn" title="Convert Scanned PDF to Editable Text">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M4 7V4h16v3M9 20h6M12 4v16"/>
      </svg>
      <span>Run OCR</span>
    </button>
    <!-- File Input & Save -->
    <label class="btn primary">
      📂 Open PDF
      <input type="file" id="pdfFile" accept="application/pdf" style="display:none;" />
    </label>
    <button class="btn success" id="saveBtn">💾 Save PDF</button>

    <div class="divider"></div>

    <button id="reorderToolBtn" class="tool-btn active" title="Toggle Page Reorder Sidebar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M7 15l5 5 5-5M7 9l5-5 5 5"/>
      </svg>
      <span>Reorder Pages</span>
    </button>

    <!-- Undo / Redo -->
    <button class="btn" id="undoBtn" title="Undo (Ctrl+Z)" disabled>↩️ <span class="btn-label">Undo</span></button>
    <button class="btn" id="redoBtn" title="Redo (Ctrl+Y)" disabled>↪️ <span class="btn-label">Redo</span></button>

    <div class="divider"></div>

    <!-- Page Structure Actions (RESTORED) -->
    <button class="btn" id="addBlankPageBtn" title="Add New Blank Page">➕ <span class="btn-label">Add Page</span></button>
    <button class="btn" id="deletePageBtn" title="Delete Active Page">🗑️ <span class="btn-label">Delete Page</span></button>
    <button class="btn" id="toolbarRotateBtn" title="Rotate Current Page">🔄 <span class="btn-label">Rotate</span></button>
    <div class="divider"></div>

    <!-- Editing & Object Tools -->
    <button class="btn tool-btn" id="editTextBtn" title="Edit Existing Text">✏️ <span class="btn-label">Edit Text</span></button>
    
    <label class="btn tool-btn" title="Add Image or Signature">
      🖼️ <span class="btn-label">Image/Sig</span>
      <input type="file" id="imageLoader" accept="image/png, image/jpeg" style="display:none;" />
    </label>

    <button class="btn tool-btn" id="deleteObjectBtn" data-tool="delete-object" title="Click element to remove it">
      ❌ <span class="btn-label">Delete Object</span>
    </button>

    <div class="divider"></div>

    <!-- Annotations -->
    <button class="btn tool-btn" data-tool="pen" title="Freehand Pen">🖊️ <span class="btn-label">Pen</span></button>
    <button class="btn tool-btn" data-tool="highlight" title="Highlight Text">🖍️ <span class="btn-label">Highlight</span></button>
    <button class="btn tool-btn" data-tool="underline" title="Underline">➖ <span class="btn-label">Underline</span></button>
    <button class="btn tool-btn" data-tool="strikethrough" title="Strikethrough">〰️ <span class="btn-label">Strikethrough</span></button>
    <button class="btn tool-btn" data-tool="text" title="Add Text Box">💬 <span class="btn-label">Add Text</span></button>
    <button class="btn tool-btn" data-tool="sticky-note" title="Sticky Note">🗒️ <span class="btn-label">Sticky Note</span></button>
    <button class="btn tool-btn" data-tool="whiteout" title="Whiteout Area">⬜ <span class="btn-label">Whiteout</span></button>
    <button class="btn tool-btn" data-tool="eraser" title="Erase Markings">🧽 <span class="btn-label">Eraser</span></button>

    <div class="divider"></div>

    <!-- Shapes -->
    <button class="btn tool-btn" data-tool="rect" title="Rectangle">▭ <span class="btn-label">Rectangle</span></button>
    <button class="btn tool-btn" data-tool="circle" title="Circle / Ellipse">⬭ <span class="btn-label">Circle</span></button>
    <button class="btn tool-btn" data-tool="line" title="Straight Line">📏 <span class="btn-label">Line</span></button>
    <button class="btn tool-btn" data-tool="arrow" title="Arrow">➡️ <span class="btn-label">Arrow</span></button>

    <div class="color-picker-wrapper" title="Tool Color">
      <input type="color" id="drawColor" value="#ff0000" />
    </div>

    <select id="textFontSize" title="Add Text: Font Size" style="padding:6px;border-radius:6px;border:1px solid #ccc;">
      <option value="12">12px</option>
      <option value="14">14px</option>
      <option value="16" selected>16px</option>
      <option value="20">20px</option>
      <option value="24">24px</option>
      <option value="32">32px</option>
      <option value="40">40px</option>
    </select>

    <select id="textFontFamily" title="Add Text: Font" style="padding:6px;border-radius:6px;border:1px solid #ccc;">
      <option value="Arial, sans-serif" selected>Arial</option>
      <option value="'Times New Roman', serif">Times New Roman</option>
      <option value="'Courier New', monospace">Courier New</option>
      <option value="Georgia, serif">Georgia</option>
    </select>

    <div class="divider"></div>

    <!-- Navigation & Zoom -->
    <button class="btn" id="panBtn" title="Pan / Hand Tool">✋ <span class="btn-label">Pan</span></button>
    <button class="btn" id="zoomOut" title="Zoom Out">🔍-</button>
    <button class="btn" id="zoomIn" title="Zoom In">🔍+</button>
    <button class="btn" id="fitPageBtn" title="Fit Entire Page">📄 <span class="btn-label">Fit Page</span></button>
    <button class="btn" id="fitWidthBtn" title="Fit Page Width">↔️ <span class="btn-label">Fit Width</span></button>
    <button class="btn" id="twoPageBtn" title="Toggle Two-Page View">📖 <span class="btn-label">Two Page</span></button>

    <div class="divider"></div>

    <!-- Search Controls (RESTORED) -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Find text..." />
      <button class="btn small" id="searchPrev">▲</button>
      <button class="btn small" id="searchNext">▼</button>
      <span id="searchCount"></span>
    </div>
  </div>

  <div class="workspace">
    <div class="sidebar" id="thumbnails"></div>
    <div class="viewer" id="viewer">
      <div class="empty-state">Please open a PDF document to begin editing.</div>
    </div>
  </div>

  <script type="module" src="{{ url_for('static', filename='js/editor.js') }}?v=8"></script>

<footer style="margin-top: 50px; padding: 20px; text-align: center; font-size: 12px; color: #7f8c8d; border-top: 1px solid #ecf0f1;">
  <p>© 2026 PDFJantaParty. All rights reserved.</p>
  <p><em>PDFJantaParty is an independent tool for PDF editing, conversion, and digital signatures. We do not store your private documents, nor are we affiliated with any political entity.</em></p>
</footer>

</body>
</html>
