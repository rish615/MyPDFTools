{% if seo %}
  <meta name="description" content="{{ seo.description }}">
  <link rel="canonical" href="{{ seo.canonical }}">
  {% if seo.noindex %}<meta name="robots" content="noindex, follow">{% endif %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PDFJantaParty">
  <meta property="og:title" content="{{ seo.title }}">
  <meta property="og:description" content="{{ seo.description }}">
  <meta property="og:url" content="{{ seo.canonical }}">
  <meta property="og:image" content="{{ site_url }}/static/images/logo.png">
  <meta name="twitter:card" content="summary">
  {% for block in seo.schema %}<script type="application/ld+json">{{ block | safe }}</script>
  {% endfor %}
{% endif %}
