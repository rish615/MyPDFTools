<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title if title else 'PDFJantaParty' }}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    .upload-container {
      max-width: 600px;
      margin: 50px auto;
      padding: 30px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }
    .form-group { margin-bottom: 20px; text-align: left; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 8px; }
    .form-group input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
    .btn-submit { background: #3498db; color: #fff; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; }
    .btn-submit:hover { background: #2980b9; }
  </style>
</head>
<body>
  <div class="upload-container">
    <h2>Rearrange PDF Pages</h2>
    <p>Upload a PDF and enter the new page sequence order.</p>
    
    <form id="rearrangePagesForm">
      <div class="form-group">
        <label>Select PDF File:</label>
        <input type="file" id="rearrangePdfFile" accept=".pdf" required>
      </div>

      <div class="form-group">
        <label>New Page Order (e.g., 3, 1, 2, 4-6):</label>
        <input type="text" id="pageOrder" placeholder="e.g. 3, 1, 2, 4-6" required>
      </div>

      <button type="submit" class="btn-submit">Rearrange & Download</button>
    </form>
  </div>

  <script>
    document.getElementById("rearrangePagesForm").onsubmit = async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById("rearrangePdfFile");
      const orderInput = document.getElementById("pageOrder").value;

      if (!fileInput.files[0]) return alert("Please select a PDF file.");

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);
      formData.append("order", orderInput);

      try {
        const res = await fetch("/rearrange-pages", {
          method: "POST",
          body: formData
        });

        if (res.ok) {
          const blob = await res.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "Rearranged_Document.pdf";
          document.body.appendChild(a);
          a.click();
          a.remove();
        } else {
          const err = await res.json();
          alert(err.error || "Failed to rearrange pages.");
        }
      } catch (err) {
        alert("An error occurred while reordering pages.");
      }
    };
  </script>

<footer style="margin-top: 50px; padding: 20px; text-align: center; font-size: 12px; color: #7f8c8d; border-top: 1px solid #ecf0f1;">
  <p>© 2026 PDFJantaParty. All rights reserved.</p>
  <p><em>PDFJantaParty is an independent tool for PDF editing, conversion, and digital signatures. We do not store your private documents, nor are we affiliated with any political entity.</em></p>
</footer>

</body>
</html>
