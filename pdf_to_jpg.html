<!DOCTYPE html>
<html>
<head>

<title>{{ title if title else 'PDFJantaParty' }}</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
.box{max-width:700px;margin:50px auto;background:#fff;padding:30px;border-radius:12px}
input{width:100%;padding:12px;margin:10px 0}
button{background:#e53935;color:#fff;border:none;padding:14px 25px;border-radius:8px;cursor:pointer}

</head>
<body>

<div class="box">

<h1>PDF to JPG</h1>

<button type="submit">Convert to JPG</button>

</form>

</div>

</footer>

</html>
